org.gradle.internal.http.socketTimeout=120000
org.gradle.jvmargs=-Dcom.sun.security.preserveKXTrustManagerState=true
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# Required until this project migrates away from the external Kotlin 2.2 plugin.
android.builtInKotlin=false
# Required by a legacy plugin still using AGP's BaseExtension API.
android.newDsl=false
android.useAndroidX=true
org.gradle.caching=false
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
