plugins {
    id 'com.android.application' version '9.2.0'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.10'
    id 'org.jetbrains.kotlin.kapt' version '2.2.10'
    id 'jacoco'
}

android {
    compileSdk 35
    namespace "de.syss.MifareClassicTool"

    defaultConfig {
        applicationId "de.syss.MifareClassicX"
        minSdk 24
        targetSdk 35
        versionCode 72
        versionName '2.6.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

kapt {
    correctErrorTypes = true
}

dependencyLocking {
    lockAllConfigurations()
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')
    group = 'verification'
    description = 'Generates JaCoCo coverage reports for debug unit tests.'

    reports {
        xml.required = true
        html.required = true
    }

    def excludedClasses = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', 'android/**/*.*'
    ]
    classDirectories.setFrom(files(
            fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: excludedClasses),
            fileTree(dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excludedClasses)
    ))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
            'jacoco/testDebugUnitTest.exec'
    ]))
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    // === Legacy (untouched) ===
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.appcompat:appcompat:1.6.1"

    // === Kotlin ===
    implementation "androidx.core:core-ktx:1.16.0"

    // === Splash Screen API ===
    implementation "androidx.core:core-splashscreen:1.0.1"

    // === Jetpack Compose (BOM) ===
    def composeBom = platform("androidx.compose:compose-bom:2025.06.01")
    implementation composeBom
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.animation:animation"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // === Activity Compose ===
    implementation "androidx.activity:activity-compose:1.10.1"

    // === Navigation Compose ===
    implementation "androidx.navigation:navigation-compose:2.9.0"

    // === Lifecycle & ViewModel ===
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1"

    // === Room Database ===
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    kapt "androidx.room:room-compiler:2.7.1"

    // === Kotlinx Serialization (JSON import/export) ===
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"

    // === Coil (Image loading for Vendor icons) ===
    implementation "io.coil-kt:coil-compose:2.7.0"

    // === Biometric authentication ===
    implementation "androidx.biometric:biometric:1.1.0"

    // === Kotlinx Coroutines ===
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // === ZXing (QR Code generation) ===
    implementation "com.google.zxing:core:3.5.3"

    // === CameraX (QR Code scanning) ===
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"

    // === Unit tests ===
    testImplementation "junit:junit:4.13.2"

    // === Instrumented database tests ===
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.room:room-testing:2.7.1"
    androidTestImplementation composeBom
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
